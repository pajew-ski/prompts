# The cards in index.html are generated by build.js from content/de/<slug>.md
# with content/en/<slug>.md, skills/<name>/SKILL.md and agents/<name>/AGENTS.md
# with card.md. This check fails when index.html is not what those sources
# give (someone edited the page by hand or forgot to run the build), and when a
# source is invalid: a SKILL.md that breaks the Agent Skills rules, a strategy
# without a prompt block or missing in one language, a level or tag that is
# missing or does not match between the languages. No dependency: node and its
# standard library.
name: Check generated cards

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js --check
