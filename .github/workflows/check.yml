# The cards in index.html are generated by build.js from content/<slug>.md,
# skills/<name>/SKILL.md and agents/<name>/AGENTS.md with card.md. This check
# fails when index.html is not what those sources give (someone edited the
# page by hand or forgot to run the build), and when a source is invalid: a
# SKILL.md that breaks the Agent Skills rules, a strategy without a prompt
# block, a missing level or tag. No dependency: node and its standard library.
name: Check generated cards

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js --check
